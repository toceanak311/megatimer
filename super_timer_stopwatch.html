<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mega Timer 🚀</title>
  
  <!-- iOS Web App Metadata -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mega Timer">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-light: rgba(255, 255, 255, 0.1);
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* Top Nav / Mode Selector */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-light);
      z-index: 10;
    }

    .app-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-title i {
      animation: pulse 2s infinite;
    }

    .mode-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 3px;
    }

    .mode-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    /* Timer Carousel Navigation */
    .carousel-nav {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .nav-arrow {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-arrow:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .tabs-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 4px 0;
      flex: 1;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .timer-tab {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--text-muted);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .timer-tab.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    .timer-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .timer-tab.running .timer-badge { background: var(--success); animation: pulse 1s infinite; }
    .timer-tab.paused .timer-badge { background: var(--accent); }
    .timer-tab.done .timer-badge { background: var(--danger); animation: bounce 0.5s infinite; }

    .add-tab-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px dashed var(--success);
      color: var(--success);
      width: 32px;
      height: 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-y: auto;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-light);
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Mascot Display */
    .mascot {
      font-size: 3rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      transition: transform 0.3s;
    }

    /* Title Editor */
    .title-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .timer-title-input {
      background: transparent;
      border: none;
      border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      padding: 2px 6px;
      max-width: 200px;
    }

    .timer-title-input:focus {
      outline: none;
      border-bottom-color: var(--primary);
    }

    /* Display Time */
    .time-display-container {
      margin: 12px 0;
      text-align: center;
      width: 100%;
    }

    .big-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.8rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.2);
      letter-spacing: -1px;
    }

    .days-subtitle {
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
      min-height: 1.5rem;
    }

    /* Setup Controls & Quick Steppers */
    .setup-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .inputs-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .input-box label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .number-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid var(--border-light);
      border-radius: 16px;
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      text-align: center;
      padding: 8px 0;
    }

    .number-field:focus {
      outline: none;
      border-color: var(--primary);
    }

    .preset-pills {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-light);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .wheel-trigger-btn {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--primary);
      color: #a5b4fc;
      padding: 8px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Action Buttons */
    .controls-grid {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 18px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

    /* Stopwatch Lap List */
    .lap-list {
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lap-item {
      background: rgba(0,0,0,0.2);
      padding: 6px 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }

    /* iOS Wheel Picker Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .wheel-modal {
      width: 100%;
      max-width: 450px;
      background: #1e293b;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
    }

    .modal-overlay.open .wheel-modal {
      transform: translateY(0);
    }

    .picker-container {
      display: flex;
      justify-content: space-around;
      height: 160px;
      position: relative;
      overflow: hidden;
    }

    .picker-column {
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      text-align: center;
    }

    .picker-column::-webkit-scrollbar { display: none; }

    .picker-spacer { height: 60px; }

    .picker-item {
      height: 40px;
      line-height: 40px;
      font-size: 1.2rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      scroll-snap-align: center;
    }

    .picker-item.selected {
      color: white;
      font-weight: bold;
      font-size: 1.4rem;
    }

    .picker-highlight {
      position: absolute;
      top: 60px;
      left: 10px;
      right: 10px;
      height: 40px;
      background: rgba(99, 102, 241, 0.2);
      border-top: 1px solid var(--primary);
      border-bottom: 1px solid var(--primary);
      border-radius: 8px;
      pointer-events: none;
    }

    /* Animations */
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header>
    <div class="app-title">
      <i class="fa-solid fa-hourglass-start"></i> MegaTimer
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="mode-timer-btn" onclick="switchMode('timer')">
        <i class="fa-solid fa-clock"></i> Timers
      </button>
      <button class="mode-btn" id="mode-stopwatch-btn" onclick="switchMode('stopwatch')">
        <i class="fa-solid fa-stopwatch"></i> Stopwatch
      </button>
    </div>
  </header>

  <!-- Carousel Navigation for Timers -->
  <div class="carousel-nav" id="timer-carousel-nav">
    <button class="nav-arrow" id="prev-tab-btn" onclick="scrollTabs(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="tabs-wrapper" id="tabs-wrapper">
      <!-- Tabs generated dynamically -->
    </div>
    <button class="add-tab-btn" onclick="addNewTimer()"><i class="fa-solid fa-plus"></i></button>
    <button class="nav-arrow" id="next-tab-btn" onclick="scrollTabs(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <!-- Main View -->
  <main id="main-content">
    <div class="card" id="main-card">
      <div class="mascot" id="mascot">🌟</div>
      
      <div class="title-container" id="title-container">
        <input type="text" id="timer-title" class="timer-title-input" value="Timer 1" maxlength="18" onchange="updateCurrentTitle(this.value)">
        <button class="pill-btn" style="color:var(--danger); padding: 4px 8px;" onclick="deleteCurrentTimer()"><i class="fa-solid fa-trash"></i></button>
      </div>

      <div class="time-display-container">
        <div class="big-time" id="time-display">00:00:00</div>
        <div class="days-subtitle" id="days-display">(0 Days)</div>
      </div>

      <!-- Setup Controls for Timer -->
      <div class="setup-section" id="timer-setup">
        <div class="inputs-grid">
          <div class="input-box">
            <label>Hours</label>
            <input type="number" id="input-hours" class="number-field" min="0" max="9999" placeholder="96" oninput="handleManualInputChange()">
          </div>
          <div class="input-box">
            <label>Mins</label>
            <input type="number" id="input-mins" class="number-field" min="0" max="59" placeholder="00" oninput="handleManualInputChange()">
          </div>
          <div class="input-box">
            <label>Secs</label>
            <input type="number" id="input-secs" class="number-field" min="0" max="59" placeholder="00" oninput="handleManualInputChange()">
          </div>
        </div>

        <div class="preset-pills">
          <button class="pill-btn" onclick="addHours(1)">+1h</button>
          <button class="pill-btn" onclick="addHours(12)">+12h</button>
          <button class="pill-btn" onclick="addHours(24)">+24h (1d)</button>
          <button class="pill-btn" onclick="addHours(96)">+96h (4d)</button>
          <button class="pill-btn" onclick="addHours(720)">+720h (30d)</button>
        </div>

        <button class="wheel-trigger-btn" onclick="openWheelModal()">
          <i class="fa-solid fa-sliders"></i> Open Wheel Roller Picker
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="controls-grid" id="controls-timer">
        <button class="btn btn-primary" id="start-btn" onclick="startTimer()"><i class="fa-solid fa-play"></i> Start</button>
        <button class="btn btn-danger" id="reset-btn" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      </div>

      <!-- Stopwatch Laps Controls & Container -->
      <div id="stopwatch-extra" style="display:none; width:100%;">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="recordLap()"><i class="fa-solid fa-flag"></i> Lap</button>
        </div>
        <div class="lap-list" id="lap-list"></div>
      </div>

    </div>
  </main>

  <!-- iOS Wheel Roller Picker Modal -->
  <div class="modal-overlay" id="wheel-modal">
    <div class="wheel-modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:1.1rem;">Scroll to Select Time</h3>
        <button class="pill-btn" onclick="closeWheelModal()">Done</button>
      </div>
      
      <div class="picker-container">
        <div class="picker-highlight"></div>
        <div class="picker-column" id="picker-hours" onscroll="handleWheelScroll('hours')"></div>
        <div class="picker-column" id="picker-mins" onscroll="handleWheelScroll('mins')"></div>
        <div class="picker-column" id="picker-secs" onscroll="handleWheelScroll('secs')"></div>
      </div>

      <button class="btn btn-primary" onclick="closeWheelModal()">Set Time</button>
    </div>
  </div>

  <script>
    /* Audio System using Web Audio API */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 600, duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCelebrationFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 0.3), idx * 150);
      });
    }

    /* State Management */
    let currentMode = 'timer'; // 'timer' or 'stopwatch'
    let timers = [];
    let activeTimerIndex = 0;
    let mainInterval = null;

    // Stopwatch State
    let stopwatch = {
      status: 'stopped', // 'running', 'paused', 'stopped'
      startTime: 0,
      elapsedTime: 0,
      laps: []
    };

    /* Initialization */
    function init() {
      loadState();
      if (timers.length === 0) {
        addNewTimer("Timer 1", 96 * 3600); // Default 96 hours
      }
      setupWheelColumns();
      renderTabs();
      updateUI();
      
      mainInterval = setInterval(tick, 100);
      setupSwipeGestures();
    }

    function createTimerObject(title = "New Timer", durationSecs = 3600) {
      return {
        id: Date.now() + Math.random(),
        title: title,
        duration: durationSecs,
        remaining: durationSecs,
        status: 'stopped', // 'running', 'paused', 'done', 'stopped'
        targetTimestamp: null,
        mascot: getRandomMascot()
      };
    }

    function getRandomMascot() {
      const mascots = ['🚀', '⚡', '🐉', '🦄', '🏰', '👾', '🦁', '👑', '🌈', '🛸'];
      return mascots[Math.floor(Math.random() * mascots.length)];
    }

    /* Main Tick Loop */
    function tick() {
      const now = Date.now();
      let needsSave = false;

      // Update active Timers
      timers.forEach(t => {
        if (t.status === 'running') {
          const left = Math.max(0, Math.round((t.targetTimestamp - now) / 1000));
          if (left !== t.remaining) {
            t.remaining = left;
            needsSave = true;
          }
          if (t.remaining <= 0) {
            t.status = 'done';
            t.remaining = 0;
            triggerCompletion(t);
            needsSave = true;
          }
        }
      });

      // Update Stopwatch
      if (stopwatch.status === 'running') {
        stopwatch.elapsedTime = now - stopwatch.startTime;
      }

      updateUI();
      if (needsSave) saveState();
    }

    /* Render UI */
    function updateUI() {
      if (currentMode === 'timer') {
        const cur = timers[activeTimerIndex];
        if (!cur) return;

        document.getElementById('mascot').innerText = cur.status === 'done' ? '🎉' : cur.mascot;
        document.getElementById('timer-title').value = cur.title;
        
        // Display formatted time
        const secs = cur.status === 'stopped' ? cur.duration : cur.remaining;
        document.getElementById('time-display').innerText = formatTimeHHMMSS(secs);
        document.getElementById('days-display').innerText = formatDaysSubtitle(secs);

        // Control buttons state
        const startBtn = document.getElementById('start-btn');
        if (cur.status === 'running') {
          startBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
          startBtn.className = 'btn btn-primary';
        } else if (cur.status === 'paused') {
          startBtn.innerHTML = '<i class="fa-solid fa-play"></i> Resume';
          startBtn.className = 'btn btn-success';
        } else {
          startBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
          startBtn.className = 'btn btn-primary';
        }

        document.getElementById('timer-setup').style.display = cur.status === 'stopped' ? 'flex' : 'none';
        document.getElementById('stopwatch-extra').style.display = 'none';
        document.getElementById('title-container').style.display = 'flex';

      } else {
        // Stopwatch Mode UI
        document.getElementById('mascot').innerText = '⏱️';
        document.getElementById('title-container').style.display = 'none';
        document.getElementById('timer-setup').style.display = 'none';
        document.getElementById('stopwatch-extra').style.display = 'block';

        const totalSecs = Math.floor(stopwatch.elapsedTime / 1000);
        document.getElementById('time-display').innerText = formatTimeHHMMSS(totalSecs);
        document.getElementById('days-display').innerText = formatDaysSubtitle(totalSecs);

        const startBtn = document.getElementById('start-btn');
        if (stopwatch.status === 'running') {
          startBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
          startBtn.className = 'btn btn-primary';
        } else {
          startBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
          startBtn.className = 'btn btn-primary';
        }
      }

      renderTabs();
    }

    function formatTimeHHMMSS(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatDaysSubtitle(totalSeconds) {
      const hours = totalSeconds / 3600;
      const days = (hours / 24).toFixed(1);
      return `(${days} Days)`;
    }

    /* Tabs Navigation */
    function renderTabs() {
      const wrapper = document.getElementById('tabs-wrapper');
      wrapper.innerHTML = '';

      if (currentMode === 'stopwatch') {
        document.getElementById('timer-carousel-nav').style.display = 'none';
        return;
      }

      document.getElementById('timer-carousel-nav').style.display = 'flex';

      timers.forEach((t, idx) => {
        const tab = document.createElement('div');
        tab.className = `timer-tab ${t.status} ${idx === activeTimerIndex ? 'active' : ''}`;
        tab.onclick = () => selectTimer(idx);

        tab.innerHTML = `
          <div class="timer-badge"></div>
          <span>${t.title}</span>
        `;
        wrapper.appendChild(tab);
      });
    }

    function selectTimer(index) {
      playBeep(800, 0.05);
      activeTimerIndex = index;
      const cur = timers[activeTimerIndex];
      if (cur.status === 'stopped') {
        syncInputsWithDuration(cur.duration);
      }
      updateUI();
    }

    function scrollTabs(direction) {
      const wrapper = document.getElementById('tabs-wrapper');
      wrapper.scrollBy({ left: direction * 120, behavior: 'smooth' });
    }

    function addNewTimer(title = null, durationSecs = 3600) {
      if (timers.length >= 10) {
        alert("Maximum of 10 timers reached!");
        return;
      }
      playBeep(900, 0.1);
      const newT = createTimerObject(title || `Timer ${timers.length + 1}`, durationSecs);
      timers.push(newT);
      activeTimerIndex = timers.length - 1;
      syncInputsWithDuration(newT.duration);
      saveState();
      updateUI();
    }

    function deleteCurrentTimer() {
      if (timers.length <= 1) {
        alert("You must keep at least one timer!");
        return;
      }
      timers.splice(activeTimerIndex, 1);
      activeTimerIndex = Math.max(0, activeTimerIndex - 1);
      saveState();
      updateUI();
    }

    function updateCurrentTitle(val) {
      if (timers[activeTimerIndex]) {
        timers[activeTimerIndex].title = val || "Timer";
        saveState();
        renderTabs();
      }
    }

    /* Manual Inputs & Quick Presets */
    function handleManualInputChange() {
      const h = parseInt(document.getElementById('input-hours').value) || 0;
      const m = parseInt(document.getElementById('input-mins').value) || 0;
      const s = parseInt(document.getElementById('input-secs').value) || 0;

      const totalSecs = (h * 3600) + (m * 60) + s;
      const cur = timers[activeTimerIndex];
      if (cur && cur.status === 'stopped') {
        cur.duration = totalSecs;
        cur.remaining = totalSecs;
        saveState();
        updateUI();
      }
    }

    function addHours(h) {
      playBeep(700, 0.05);
      const cur = timers[activeTimerIndex];
      if (cur && cur.status === 'stopped') {
        cur.duration += h * 3600;
        cur.remaining = cur.duration;
        syncInputsWithDuration(cur.duration);
        saveState();
        updateUI();
      }
    }

    function syncInputsWithDuration(totalSecs) {
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;

      document.getElementById('input-hours').value = h || '';
      document.getElementById('input-mins').value = m || '';
      document.getElementById('input-secs').value = s || '';
    }

    /* Start / Pause / Reset Actions */
    function startTimer() {
      playBeep(1000, 0.1);
      if (currentMode === 'timer') {
        const cur = timers[activeTimerIndex];
        if (!cur) return;

        if (cur.status === 'running') {
          // Pause
          cur.status = 'paused';
        } else {
          // Start or Resume
          if (cur.remaining <= 0) cur.remaining = cur.duration;
          cur.targetTimestamp = Date.now() + (cur.remaining * 1000);
          cur.status = 'running';
        }
      } else {
        // Stopwatch Start/Pause
        if (stopwatch.status === 'running') {
          stopwatch.status = 'paused';
        } else {
          stopwatch.startTime = Date.now() - stopwatch.elapsedTime;
          stopwatch.status = 'running';
        }
      }
      saveState();
      updateUI();
    }

    function resetTimer() {
      playBeep(400, 0.1);
      if (currentMode === 'timer') {
        const cur = timers[activeTimerIndex];
        if (!cur) return;
        cur.status = 'stopped';
        cur.remaining = cur.duration;
      } else {
        stopwatch.status = 'stopped';
        stopwatch.elapsedTime = 0;
        stopwatch.laps = [];
        document.getElementById('lap-list').innerHTML = '';
      }
      saveState();
      updateUI();
    }

    function triggerCompletion(timer) {
      playCelebrationFanfare();
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    /* Stopwatch Lap System */
    function recordLap() {
      if (stopwatch.status !== 'running') return;
      playBeep(1100, 0.05);
      const lapTime = formatTimeHHMMSS(Math.floor(stopwatch.elapsedTime / 1000));
      stopwatch.laps.unshift(lapTime);

      const list = document.getElementById('lap-list');
      const item = document.createElement('div');
      item.className = 'lap-item';
      item.innerHTML = `<span>Lap ${stopwatch.laps.length}</span> <span>${lapTime}</span>`;
      list.prepend(item);
    }

    /* Mode Switching */
    function switchMode(mode) {
      playBeep(600, 0.05);
      currentMode = mode;
      document.getElementById('mode-timer-btn').className = `mode-btn ${mode === 'timer' ? 'active' : ''}`;
      document.getElementById('mode-stopwatch-btn').className = `mode-btn ${mode === 'stopwatch' ? 'active' : ''}`;
      updateUI();
    }

    /* iOS Roller Picker Modal logic */
    function setupWheelColumns() {
      populateColumn('picker-hours', 100);
      populateColumn('picker-mins', 60);
      populateColumn('picker-secs', 60);
    }

    function populateColumn(id, count) {
      const col = document.getElementById(id);
      col.innerHTML = '<div class="picker-spacer"></div>';
      for (let i = 0; i < count; i++) {
        const item = document.createElement('div');
        item.className = 'picker-item';
        item.innerText = String(i).padStart(2, '0');
        col.appendChild(item);
      }
      col.innerHTML += '<div class="picker-spacer"></div>';
    }

    function openWheelModal() {
      document.getElementById('wheel-modal').classList.add('open');
    }

    function closeWheelModal() {
      document.getElementById('wheel-modal').classList.remove('open');
      handleManualInputChange();
    }

    function handleWheelScroll(type) {
      const col = document.getElementById(`picker-${type}`);
      const index = Math.round(col.scrollTop / 40);
      const input = document.getElementById(`input-${type}`);
      if (input) {
        input.value = index;
        handleManualInputChange();
      }
    }

    /* Swipe Gestures for iPhone */
    function setupSwipeGestures() {
      const card = document.getElementById('main-card');
      let touchStartX = 0;

      card.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      card.addEventListener('touchend', e => {
        const touchEndX = e.changedTouches[0].screenX;
        if (currentMode !== 'timer') return;

        if (touchStartX - touchEndX > 50) {
          // Swipe Left -> Next Timer
          if (activeTimerIndex < timers.length - 1) selectTimer(activeTimerIndex + 1);
        } else if (touchEndX - touchStartX > 50) {
          // Swipe Right -> Prev Timer
          if (activeTimerIndex > 0) selectTimer(activeTimerIndex - 1);
        }
      }, { passive: true });
    }

    /* LocalStorage Persistence */
    function saveState() {
      const data = {
        timers: timers,
        activeTimerIndex: activeTimerIndex,
        stopwatch: stopwatch
      };
      localStorage.setItem('megatimer_state', JSON.stringify(data));
    }

    function loadState() {
      const saved = localStorage.getItem('megatimer_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          timers = parsed.timers || [];
          activeTimerIndex = parsed.activeTimerIndex || 0;
          stopwatch = parsed.stopwatch || stopwatch;
        } catch(e) {
          console.error(e);
        }
      }
    }

    window.onload = init;
  </script>
</body>
</html>
